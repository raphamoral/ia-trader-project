name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - name: Install dependencies
        run: |
          python -m pip install pipenv
          pipenv install --dev
      - name: Run tests
        run: pipenv run python -m pytest -q
